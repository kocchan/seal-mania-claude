name: Collect Sighting

on:
  schedule:
    # 1時間ごと（8:00〜24:00 JST = 23:00〜15:00 UTC）
    - cron: '0 23 * * *'      # JST 8:00
    - cron: '0 0-15 * * *'    # JST 9:00-24:00
  workflow_dispatch: # 手動実行

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Scrape Yahoo (X)
        run: npm run scrape:yahoo

      - name: Scrape Threads
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: npm run scrape:threads
        continue-on-error: true  # APIFY_TOKEN未設定でも続行

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/blog/raw/
          git diff --staged --quiet || git commit -m "chore: collect sighting data [skip ci]"
          git push
