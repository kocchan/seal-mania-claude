name: 抽選・新作記事 WordPress投稿

# 必要な GitHub Secrets:
#   WP_API_URL          - 例: https://www.seal-search.com/wp-json/wp/v2
#   WP_USER             - WordPress ユーザー名
#   WP_APP_PASSWORD     - WordPress アプリケーションパスワード
#   YAHOO_CLIENT_ID     - Yahoo!ショッピングAPI（アフィリエイト商品検索）
#   AMAZON_ASSOCIATE_ID - Amazonアソシエイトタグ
#   RAKUTEN_AFFILIATE_ID - 楽天アフィリエイトID

on:
  schedule:
    # 毎日 10:30 JST (= 01:30 UTC) に実行。Claude Routine（10:00 実行）の完了を待つ
    - cron: '30 1 * * *'
  push:
    branches: [main]
    paths:
      - 'output/lottery-info/drafts/**/*.md'
      - 'output/newproduct/drafts/**/*.md'
      - 'output/new-releases/drafts/**/*.md'
      - 'output/mejirushi/drafts/**/*.md'
  workflow_dispatch:

concurrency:
  group: post-wordpress
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Claude Routine が main 宛に作る PR (claude/* ブランチ) を自動マージ
      # schedule / workflow_dispatch のみで実行（push 起動時は対象なし）
      - name: 🔀 Claude routine の PR を main にマージ
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs=$(gh pr list --base main --state open \
            --json number,headRefName,isDraft \
            --jq '.[] | select(.headRefName | startswith("claude/")) | .number')

          if [ -z "$prs" ]; then
            echo "✓ オープンな claude/* PR なし。マージ処理スキップ"
            exit 0
          fi

          for pr in $prs; do
            echo "▶ PR #$pr をマージ中..."
            # Draft の場合は ready にする（既に ready ならエラーが出るが続行）
            gh pr ready "$pr" 2>/dev/null || true
            # Merge commit でマージ（コンフリクト等で失敗しても続行）
            if gh pr merge "$pr" --merge --delete-branch=false; then
              echo "✓ PR #$pr マージ成功"
            else
              echo "✗ PR #$pr マージ失敗（コンフリクト等）"
            fi
          done

          # マージ後の最新 main を取り込む
          git fetch origin main
          git reset --hard origin/main

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存関係インストール
        run: npm ci

      - name: 🚀 WordPress 投稿（抽選）
        run: npm run lotteryinfo:post
        env:
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          AMAZON_ASSOCIATE_ID: ${{ secrets.AMAZON_ASSOCIATE_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      - name: 🚀 WordPress 投稿（新作）
        run: npm run newproduct:post
        env:
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          AMAZON_ASSOCIATE_ID: ${{ secrets.AMAZON_ASSOCIATE_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      - name: 🚀 WordPress 投稿（新作販売）
        run: npm run newreleases:post
        env:
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          AMAZON_ASSOCIATE_ID: ${{ secrets.AMAZON_ASSOCIATE_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      # めじるしのアイキャッチはGemini生成を廃止（2026-07-20・API費用削減）。
      # 投稿時は og:image を仮アイキャッチにし、ローカルMacの
      # `npm run mejirushi:retrofit`（launchd定期実行）が ComfyUI で
      # 本サムネを生成して後付けする方式。
      - name: 🚀 WordPress 投稿（めじるし新作）
        run: npm run mejirushi:post
        env:
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          AMAZON_ASSOCIATE_ID: ${{ secrets.AMAZON_ASSOCIATE_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

      - name: 💾 投稿済みフラグをコミット
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/lottery-info/drafts output/newproduct/drafts output/new-releases/drafts
          [ -d output/mejirushi/drafts ] && git add output/mejirushi/drafts || true
          [ -d output/mejirushi/images ] && git add output/mejirushi/images || true
          if git diff --staged --quiet; then
            echo "変更なし - コミットをスキップ"
          else
            git commit -m "chore: 抽選/新作記事のpostedフラグ更新 [skip ci]"
            git push
          fi
